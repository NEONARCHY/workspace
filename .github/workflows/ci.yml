name: ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-notes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.areas.outputs.python }}
      desktop: ${{ steps.areas.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
      - name: Select checks from the complete pull request diff
        id: areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/changed-areas.mjs
      - name: Require user-facing update text
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/validate-release-notes.mjs "$BASE_SHA" "$GITHUB_SHA"
      - name: Test CI gates, independent notes and PR overlap reporting
        run: node --test scripts/ci/changed-areas.test.mjs scripts/ci/required-check.test.mjs scripts/ci/update-test-timings.test.mjs scripts/lib/release-note-order.test.mjs scripts/lib/pr-overlap.test.mjs

  python-checks:
    needs: release-notes
    if: needs.release-notes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: yuksalish_test
          POSTGRES_USER: yuksalish_test
          POSTGRES_PASSWORD: change-me-integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yuksalish_test -d yuksalish_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      YUKSALISH_DATABASE_URL: postgresql+asyncpg://yuksalish_test:change-me-integration-only@127.0.0.1:5432/yuksalish_test
      YUKSALISH_TEST_DATABASE_URL: postgresql+asyncpg://yuksalish_test:change-me-integration-only@127.0.0.1:5432/yuksalish_test
    steps:
      - uses: actions/checkout@v4
      - name: Validate LAN HTTPS configuration
        run: >-
          docker run --rm
          -e YUKSALISH_LAN_IP=192.168.0.50
          -v "${{ github.workspace }}/infrastructure/lan/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: alembic -c apps/api/alembic.ini upgrade head
      - run: ruff check .
      - run: mypy apps modules
      - run: pytest
      - name: Verify personal development database isolation guards
        run: python -m unittest discover -s scripts/dev -p "test_bootstrap_local.py"
      # Applied Alembic migrations are immutable and contain reviewed, trusted SQL literals.
      # Scan executable application code while keeping historical migrations unchanged.
      - run: bandit -q -r apps modules -x tests,apps/api/migrations
      - name: Audit Python dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if audit_log="$(pip-audit --skip-editable 2>&1)"; then
              printf '%s\n' "$audit_log"
              exit 0
            else
              audit_status=$?
            fi

            printf '%s\n' "$audit_log" >&2
            if ! grep -Eq '502 Server Error|503 Server Error|504 Server Error|429 Client Error|Temporary failure in name resolution|Name or service not known|ConnectionError|ReadTimeout|ConnectTimeout' <<< "$audit_log"; then
              exit "$audit_status"
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$audit_status"
            fi

            sleep $((attempt * 10))
          done

  desktop-checks:
    needs: release-notes
    if: needs.release-notes.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate environment templates
        shell: pwsh
        run: |
          .\scripts\validate-environment.ps1 -Environment development -EnvFile .env.example
          .\scripts\validate-environment.ps1 -Environment staging -EnvFile .env.staging.example -AllowPlaceholders
          .\scripts\validate-environment.ps1 -Environment production -EnvFile .env.production.example -AllowPlaceholders
          .\scripts\validate-environment.ps1 -Environment production -EnvFile .env.lan.example -NetworkMode lan -AllowPlaceholders
          foreach ($file in Get-ChildItem scripts/lan/*.ps1) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell syntax error in $($file.Name): $($errors[0].Message)" }
          }
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify personal development configuration isolation
        run: pnpm test:local-dev
      - name: Verify every desktop test is assigned to exactly one shard
        run: node scripts/ci/verify-test-shards.mjs
      - name: Prepare Docker release numbering metadata
        shell: pwsh
        run: |
          try { .\scripts\lan\prepare-release-note-order.ps1 }
          catch { Write-Host $_.ScriptStackTrace; throw }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm build:web
      - name: Validate LAN web Compose
        shell: pwsh
        run: |
          $env:YUKSALISH_ENV_FILE = (Resolve-Path ".env.lan.example").Path
          $env:YUKSALISH_WEB_BUILD_ID = "ci"
          docker compose --env-file .env.lan.example `
            -f infrastructure/compose.yaml `
            -f infrastructure/compose.lan.yaml config --quiet
      - run: pnpm audit --audit-level low
      - name: Check build dependency compatibility
        run: node scripts/build-dependencies-smoke.cjs

  desktop-tests:
    needs: release-notes
    if: needs.release-notes.outputs.desktop == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare release numbering metadata for consistency tests
        shell: pwsh
        run: |
          try { .\scripts\lan\prepare-release-note-order.ps1 }
          catch { Write-Host $_.ScriptStackTrace; throw }
      # Each Windows runner has limited memory; parallel test workers can starve
      # jsdom timers and trigger false 10-second UI timeouts.
      # BalancedSequencer assigns all discovered tests by recorded Windows cost.
      - run: pnpm --filter @yuksalish/desktop exec vitest run --shard=${{ matrix.shard }}/4 --maxWorkers=1

  # Keep all existing required names; only explicitly irrelevant work may be skipped.
  python:
    if: ${{ always() }}
    needs: [release-notes, python-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the selected Python checks
        env:
          PREFLIGHT_RESULT: ${{ needs.release-notes.result }}
          AREA_REQUIRED: ${{ needs.release-notes.outputs.python }}
          CHECK_RESULTS: ${{ needs.python-checks.result }}
        run: node scripts/ci/required-check.mjs

  desktop:
    if: ${{ always() }}
    needs: [release-notes, desktop-checks, desktop-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require all selected desktop checks and test shards
        env:
          PREFLIGHT_RESULT: ${{ needs.release-notes.result }}
          AREA_REQUIRED: ${{ needs.release-notes.outputs.desktop }}
          CHECK_RESULTS: ${{ needs.desktop-checks.result }},${{ needs.desktop-tests.result }}
        run: node scripts/ci/required-check.mjs

  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
