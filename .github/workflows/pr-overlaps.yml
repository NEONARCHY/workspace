name: PR overlap advisory

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-overlap-advisory-${{ github.repository }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted main code runs, never the pull request head. No write token or secrets.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
      - name: Report shared files across open PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-pr-overlaps.mjs
