packages:
  - apps/desktop
  - packages/*

overrides:
  # 2.2.27 recursively re-enters jsdom's Element.matches for state selectors.
  nwsapi: 2.2.28
  esbuild: 0.28.1
  follow-redirects: 1.16.2
  # minimatch 11 uses named exports and Matcher objects; adapters are tested below.
  minimatch: 11.0.4
  "undici@>=6 <6.29.1": 6.29.1
  "undici@>=7 <7.30.1": 7.30.1
  "brace-expansion@<1.1.21": 1.1.21
  "brace-expansion@>=2 <2.1.7": 2.1.7
  "brace-expansion@>=5 <5.0.12": 5.0.12
  "fast-uri@>=3 <3.1.9": 3.1.9
  "zod@>=4 <4.6.6": 4.6.6
  "http-cache-semantics@<=4.2.0": 4.3.0
  "source-map-js@>=1 <1.2.2": 1.2.2
  "joi@>=18 <18.3.1": 18.3.1
  "shell-quote@<1.11.0": 1.11.0
  # @electron/get only uses bootstrap(); v4 retains it and drops vulnerable sprintf-js.
  "@electron/get@3.1.0>global-agent": 4.1.3

onlyBuiltDependencies:
  - electron
  - esbuild

allowBuilds:
  electron-winstaller: set this to true or false
  esbuild: set this to true or false

patchedDependencies:
  '@electron/asar@3.4.1': patches/@electron__asar@3.4.1.patch
  'dir-compare@4.2.0': patches/dir-compare@4.2.0.patch
  'glob@7.2.3': patches/glob@7.2.3.patch
