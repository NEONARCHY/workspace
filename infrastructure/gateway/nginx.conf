# The tunnel overwrites CF-Connecting-IP; the connector is the only published
# path to port 8081. Empty keys are not counted, so working API and WebSocket
# traffic are unaffected by the public login limit.
map $http_cf_connecting_ip $remote_client_key {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}
map $uri $remote_login_key {
    default "";
    ~^/api/v1/auth/(web/)?login$ $remote_client_key;
}
limit_req_zone $remote_login_key zone=remote_login:10m rate=6r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Docker can assign a new address when the API container is rebuilt.
    # Resolve the service name continuously instead of caching that address
    # for the whole lifetime of the gateway process.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $web_upstream http://web:8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/v1/updates/ {
        client_max_body_size 350m;
        proxy_request_buffering off;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/v1/attachments/ {
        client_max_body_size 200m;
        proxy_request_buffering off;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        client_max_body_size 200m;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

# Cloudflare Tunnel reaches only this Docker-network listener. The existing
# 8080 listener remains the LAN route and keeps its larger integration limits.
server {
    listen 8081;
    server_name workspace.opinions.uz;
    server_tokens off;
    client_max_body_size 90000000;
    limit_req zone=remote_login burst=8 nodelay;
    limit_req_status 429;
    add_header Cache-Control "private, no-store" always;

    if ($host != workspace.opinions.uz) {
        return 444;
    }

    error_page 413 = @remote_file_too_large;
    location @remote_file_too_large {
        default_type application/json;
        return 413 '{"detail":"Для удалённой загрузки файл должен быть не больше 90 МБ. Подключитесь из офиса для крупных файлов."}';
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header Cache-Control;
    }
}
