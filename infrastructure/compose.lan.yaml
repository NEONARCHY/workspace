services:
  lan-https:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "${YUKSALISH_LAN_IP:?Set the reserved private IPv4 address}:8443:8443"
    environment:
      YUKSALISH_LAN_IP: ${YUKSALISH_LAN_IP:?Set the reserved private IPv4 address}
    volumes:
      - ./lan/Caddyfile:/etc/caddy/Caddyfile:ro
      - lan-caddy-data:/data
      - lan-caddy-config:/config
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - edge

volumes:
  lan-caddy-data:
  lan-caddy-config:
