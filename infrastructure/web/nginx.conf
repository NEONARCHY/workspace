server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /version.json {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, max-age=0" always;
        expires -1;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, max-age=0" always;
        expires -1;
    }

    # PDF.js uses a module worker; nosniff requires a JavaScript MIME type.
    location ~ ^/assets/.*\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, max-age=0" always;
        expires -1;
    }
}
